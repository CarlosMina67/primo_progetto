<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

    <title>{% block title %} Primo progetto {% endblock title %}</title>
  </head>
  <body>
    <!-- Navbar Bootstrap 4 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="/">Primo progetto</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav">
          
          <!-- Dropdown: Prima app -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownPrimaApp" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              Prima app
            </a>
            <div class="dropdown-menu" aria-labelledby="navbarDropdownPrimaApp">
              <a class="dropdown-item" href="{% url 'prima_app:homepage' %}">homepage</a>
              <a class="dropdown-item" href="{% url 'prima_app:welcome' %}">welcome</a>
              <a class="dropdown-item" href="{% url 'prima_app:lista' %}">lista</a>
              <a class="dropdown-item" href="{% url 'prima_app:chi_siamo' %}">chi_siamo</a>
              <a class="dropdown-item" href="{% url 'prima_app:variabili' %}">variabili</a>
            </div>
          </li>
          
          <!-- Dropdown: Seconda app -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownSecondaApp" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              Seconda app
            </a>
            <div class="dropdown-menu" aria-labelledby="navbarDropdownSecondaApp">
              <a class="dropdown-item" href="#">place holder</a>
              <a class="dropdown-item" href="#">place holder</a>
              <a class="dropdown-item" href="#">place holder</a>
              <a class="dropdown-item" href="#">place holder</a>
              <a class="dropdown-item" href="#">place holder</a>
            </div>
          </li>

        </ul>
      </div>
    </nav>

    <!-- Contenuto principale estendibile dalle altre pagine Django -->
    <div class="container mt-4">
      {% block content %}
      {% endblock content %}
    </div>

    <!-- Optional JavaScript (jQuery + Bootstrap JS bundle) prima del </body> -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
  </body>
</html>
